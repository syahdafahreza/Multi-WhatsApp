name: Build Windows Exe (Full Embedded Runtime)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-embedded-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Dependencies
        run: npm install

      - name: Download & Prepare WebView2 Fixed Version Runtime
        shell: pwsh
        run: |
          Write-Host "Downloading WebView2 Fixed Version Runtime via NuGet..."
          nuget install Microsoft.Web.WebView2.FixedVersionRuntime.x64 -ExcludeVersion -OutputDirectory runtimes
          
          $runtimeFolder = Get-ChildItem -Path runtimes -Recurse -Filter "msedge.dll" | Select-Object -First 1 | ForEach-Object { $_.Directory }
          if (-not $runtimeFolder) {
            $runtimeFolder = Get-ChildItem -Path runtimes -Directory | Select-Object -First 1
          }

          Write-Host "Found Runtime folder at: $($runtimeFolder.FullName)"
          New-Item -ItemType Directory -Force -Path "src-tauri/runtimes"
          Copy-Item -Path $runtimeFolder.FullName -Destination "src-tauri/runtimes/webview2" -Recurse -Force

          # Update tauri.conf.json to use fixedRuntime
          $confPath = "src-tauri/tauri.conf.json"
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          $conf.bundle.windows.webviewInstallMode = @{
            type = "fixedRuntime"
            path = "./runtimes/webview2"
          }
          $conf | ConvertTo-Json -Depth 10 | Set-Content $confPath
          Write-Host "Updated tauri.conf.json with fixedRuntime path ./runtimes/webview2"

      - name: Build Tauri Full Embedded EXE
        run: npx tauri build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List Output Files
        shell: pwsh
        run: |
          Get-ChildItem -Path "src-tauri/target/release" -Recurse -Filter "*.exe"

      - name: Upload Full Embedded Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Multi-WhatsApp-Full-Embedded-Windows-x64
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
